kind = "web"
previewPath = "/"
title = "Storyhold"
version = "1.0.0"
id = "artifacts/site"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = ["/"]
localPort = 3000

[services.development]
run = "pnpm -w run storyhold:build && pnpm -w run storyhold:start"

[services.production]

[services.production.build]
args = ["pnpm", "-w", "run", "storyhold:build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["pnpm", "-w", "run", "storyhold:start"]

[services.production.run.env]
PORT = "3000"
NODE_ENV = "production"
STORYHOLD_HOST = "0.0.0.0"

[services.production.health.startup]
path = "/api/healthz"

[services.env]
PORT = "3000"
STORYHOLD_HOST = "0.0.0.0"
