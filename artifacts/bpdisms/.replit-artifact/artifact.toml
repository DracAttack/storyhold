kind = "web"
previewPath = "/bpdisms/"
title = "BPD-isms Post Queue"
version = "1.0.0"
id = "artifacts/bpdisms"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/bpdisms/" ]
localPort = 21721

[services.development]
run = "pnpm --filter @workspace/bpdisms run dev"

[services.production]
publicDir = "artifacts/bpdisms/dist/public"
serve = "static"

[services.production.build]
args = [ "pnpm", "--filter", "@workspace/bpdisms", "run", "build" ]

[services.production.build.env]
NODE_ENV = "production"
PORT = "21721"
BASE_PATH = "/bpdisms/"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21721"
BASE_PATH = "/bpdisms/"

[[services]]
name = "BPD-isms API"
paths = [ "/bpdisms/api" ]
localPort = 8180

[services.development]
run = "pnpm --filter @workspace/bpdisms-api run dev"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/bpdisms-api", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["node", "--enable-source-maps", "artifacts/bpdisms-api/dist/index.mjs"]

[services.production.run.env]
PORT = "8180"
NODE_ENV = "production"
SITE_BASE_URL = "https://brainhook.net"

[services.production.health.startup]
path = "/bpdisms/api/healthz"

[services.env]
PORT = "8180"
